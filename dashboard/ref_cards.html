<!-- ref-cards: begin -->
<style>
  .ref-card { position: absolute; z-index: 40; width: max-content; max-width: min(400px, calc(100vw - 32px)); box-sizing: border-box;
    padding: 9px 12px; border-radius: 8px; border: 1px solid var(--line, #d0d7de); background: var(--paper, var(--bg, Canvas));
    color: var(--ink, CanvasText); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.18); font: 13px/1.45 system-ui, sans-serif; pointer-events: none; }
  .ref-card .rc-head { color: var(--muted, GrayText); font-size: 12px; }
  .ref-card .rc-title { font-weight: 600; margin: 3px 0 4px; }
  .ref-card .rc-meta { color: var(--muted, GrayText); font-size: 12px; }
  .ref-card .rc-note { color: var(--muted, GrayText); font-size: 11px; margin-top: 5px; font-style: italic; }
  .rc-state { display: inline-block; padding: 0 7px; border-radius: 999px; font-size: 11px; font-weight: 600; color: #fff; margin-left: 6px;
    vertical-align: 1px; background: #6e7781; }
  .rc-state.current { background: #1f883d; } .rc-state.queued { background: #9a6700; } .rc-state.open { background: #0969da; }
  .rc-state.done { background: #8250df; }
</style>
<script>
/* A card for each ^ticket(N) and ^report(N) link, on hover or focus: a
   ticket from the work dashboard's data (its area, its status, its first
   line), carried by the dashboard's own pages and read live from the
   published data anywhere else; a report from its own page, live (its
   title, date and opening). Once per page load each. */
(() => {
  const PUBLIC = "http://matthewhammer.org/hazel-work-notes/dashboard-data/data.json";
  const DATA = location.port === "8000" && /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "/data.json" : PUBLIC;
  /* the dashboard itself carries its tickets (made with the page, changed
     with it); any other page asks the published data */
  const EMBED = __TICKETS__;
  let data = EMBED ? Promise.resolve(EMBED) : null;
  const loadData = () => data || (data = fetch(DATA, { cache: "no-store" }).then(r => r.ok ? r.json() : Promise.reject(r.status)).catch(() => null));
  const pages = new Map();
  const loadReport = url => {
    if (!pages.has(url)) pages.set(url, fetch(url).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(t => {
      const doc = new DOMParser().parseFromString(t, "text/html"), h1 = doc.querySelector("h1");
      let p = h1 && h1.nextElementSibling;
      while (p && p.tagName !== "P") p = p.nextElementSibling;
      const label = (doc.querySelector(".series") || {}).textContent || "";
      return { title: h1 ? h1.textContent.trim() : doc.title, date: (label.match(/\d{4}-\d{2}-\d{2}/) || [""])[0],
               lead: p ? p.textContent.replace(/\s+/g, " ").trim() : "" };
    }).catch(() => null));
    return pages.get(url);
  };
  const esc = t => String(t).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
  const cut = (t, n) => t.length <= n ? t : t.slice(0, n).replace(/\s+\S*$/, "") + "…";
  const plain = h => new DOMParser().parseFromString("<div>" + (h || "") + "</div>", "text/html").body.textContent.replace(/\s+/g, " ").trim();
  const lead = h => { const m = /^\s*<b>([\s\S]*?)<\/b>/.exec(h || ""); return m ? plain(m[1]) : cut(plain(h), 200); };
  const ticketCard = (n, d) => {
    const open = (d.tickets || []).find(t => t.id === n), closed = (d.closed_tickets || []).find(t => t.id === n), t = open || closed;
    if (!t) return `<div class="rc-head">^ticket(${n})</div><div class="rc-note">Not on the dashboard.</div>`;
    const q = (d.queue || []).indexOf(n);
    const [cls, state] = closed ? ["done", `${t.status || "closed"}, ${t.closed || ""}`]
      : d.current_ticket === n ? ["current", "current" + (d.current_waiting ? " · ✋❔ waiting on Matthew" : "")]
      : q >= 0 ? ["queued", `queued, ${q + 1} in line`] : ["open", "open"];
    return `<div class="rc-head">^ticket(${n}) · ${esc(t.area || "")}<span class="rc-state ${cls}">${esc(state)}</span></div>` +
      `<div class="rc-title">${esc(lead(t.text))}</div>` +
      `<div class="rc-meta">${t.added ? "added " + esc(t.added) + " · " : ""}from ${esc(plain(t.source || "") || "?")}</div>` +
      (closed && t.outcome ? `<div class="rc-meta">${esc(cut(plain(t.outcome), 180))}</div>` : "");
  };
  const reportCard = (n, r) => r
    ? `<div class="rc-head">^report(${n}) · Hazel performance analysis${r.date ? " · " + esc(r.date) : ""}</div>` +
      `<div class="rc-title">${esc(r.title)}</div>` + (r.lead ? `<div class="rc-meta">${esc(cut(r.lead, 240))}</div>` : "")
    : `<div class="rc-head">^report(${n})</div><div class="rc-note">The report's page didn't load just now.</div>`;
  let card = null, over = null, timer = null;
  const place = a => {
    const r = a.getBoundingClientRect(), w = card.offsetWidth, h = card.offsetHeight;
    card.style.left = (Math.max(16, Math.min(r.left, document.documentElement.clientWidth - w - 16)) + scrollX) + "px";
    card.style.top = ((r.bottom + 6 + h < innerHeight ? r.bottom + 6 : r.top - 6 - h) + scrollY) + "px";
  };
  const refOf = a => { const c = a.querySelector("code.ref"); const m = c && /^\^(ticket|report)\((\d+)\)$/.exec(c.textContent.trim()); return m && { kind: m[1], n: Number(m[2]) }; };
  const hide = () => { clearTimeout(timer); over = null; if (card) card.hidden = true; };
  const show = (a, ref) => {
    over = a; clearTimeout(timer);
    timer = setTimeout(async () => {
      if (!card) { card = document.createElement("div"); card.className = "ref-card"; card.setAttribute("role", "tooltip"); document.body.append(card); }
      card.innerHTML = `<div class="rc-head">^${ref.kind}(${ref.n})</div><div class="rc-note">loading…</div>`;
      card.hidden = false; place(a);
      let html;
      if (ref.kind === "ticket") { const d = await loadData(); html = d ? ticketCard(ref.n, d) : `<div class="rc-head">^ticket(${ref.n})</div><div class="rc-note">The dashboard's data didn't load just now.</div>`; }
      else html = reportCard(ref.n, await loadReport(a.href));
      if (over !== a) return;
      card.innerHTML = html; place(a);
    }, 250);
  };
  const linkOf = t => t && t.closest && t.closest("a[href]");
  document.addEventListener("mouseover", e => { const a = linkOf(e.target), r = a && refOf(a); if (r && a !== over) show(a, r); });
  document.addEventListener("mouseout", e => { const a = linkOf(e.target); if (a && a === over && !a.contains(e.relatedTarget)) hide(); });
  document.addEventListener("focusin", e => { const a = linkOf(e.target), r = a && refOf(a); if (r) show(a, r); });
  document.addEventListener("focusout", hide);
  document.addEventListener("keydown", e => { if (e.key === "Escape") hide(); });
  addEventListener("scroll", () => { if (over && card && !card.hidden) place(over); }, { passive: true });
})();
</script>
<!-- ref-cards: end -->
